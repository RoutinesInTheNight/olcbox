name: Build Olcbox iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v4
        with:
          path: repo/olcbox

      - name: Checkout olcrtc (native core) as sibling
        uses: actions/checkout@v4
        with:
          repository: openlibrecommunity/olcrtc
          path: repo/olcrtc
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install gomobile and mage
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          go install github.com/magefile/mage@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Init gomobile
        run: gomobile init

      - name: Verify gomobile is on PATH
        run: which gomobile && gomobile version

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sanity check paths
        run: |
          ls -la repo/olcrtc
          ls -la repo/olcrtc/mobile
          ls -la repo/olcrtc/internal

      - name: Build unsigned archive
        working-directory: repo/olcbox
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Olcbox.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned IPA
        working-directory: repo/olcbox
        run: |
          mkdir -p build/Payload
          cp -r build/Olcbox.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r Olcbox-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Olcbox-unsigned-ipa
          path: repo/olcbox/build/Olcbox-unsigned.ipa
